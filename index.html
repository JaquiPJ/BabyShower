<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baby Shower Aurora 🎀</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", Arial, sans-serif;
            background: #fff3f6;
            color: #735766;
        }

        .contenedor {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .pantalla {
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: aparecer 0.6s ease;
        }

        .oculto {
            display: none !important;
        }

        /* ---------- PANTALLA 1 ---------- */

        .tarjeta {
            background: white;
            border-radius: 30px;
            padding: 40px 25px;
            box-shadow: 0 10px 35px rgba(190, 130, 150, 0.2);
        }

        .corazon {
            font-size: 55px;
        }

        h1 {
            color: #d889a6;
            font-family: Georgia, serif;
            font-size: 42px;
            margin: 10px 0;
        }

        h2 {
            color: #9b687d;
            font-size: 27px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 2px solid #efc6d4;
            border-radius: 15px;
            font-size: 18px;
            text-align: center;
            outline: none;
            margin: 15px 0;
        }

        input:focus {
            border-color: #d889a6;
        }

        .boton {
            width: 100%;
            border: none;
            border-radius: 18px;
            padding: 17px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: #e9a7bc;
            color: white;
            box-shadow: 0 5px 15px rgba(200, 120, 150, .25);
        }

        .boton:hover {
            transform: scale(1.02);
        }

        /* ---------- PANTALLA 2 ---------- */

        .prediccion {
            background: white;
            border-radius: 30px;
            padding: 40px 25px;
            box-shadow: 0 10px 35px rgba(190, 130, 150, 0.2);
        }

        .bebe {
            font-size: 65px;
        }

        .opciones {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .opcion {
            flex: 1;
            border: none;
            border-radius: 22px;
            padding: 25px 10px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .opcion:hover {
            transform: translateY(-5px);
        }

        .nino {
            background: #c9e8ff;
            color: #40789d;
        }

        .nina {
            background: #ffd3e1;
            color: #a65373;
        }

        /* ---------- PANTALLA 3 ---------- */

        .revelacion {
            position: relative;
            width: 100%;
            min-height: 85vh;
            border-radius: 25px;
            overflow: hidden;

            background-image: url("invitacion.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            box-shadow: 0 10px 40px rgba(180, 100, 130, .3);

            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-direction: column;
            padding: 25px 15px;
        }

        .capa {
            width: 100%;
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(4px);
            border-radius: 22px;
            padding: 15px;
            box-shadow: 0 5px 20px rgba(100, 50, 70, .15);
        }

        .gracias {
            font-size: 19px;
            margin: 0 0 5px;
            color: #80576b;
        }

        .tu-prediccion {
            margin: 0;
            font-size: 15px;
            color: #9c7b8a;
        }

        .resultado {
            font-family: Georgia, serif;
            font-size: 34px;
            margin: 5px 0;
            color: #df7d9e;
        }

        .gran-sorpresa {
            margin-top: 8px;
            font-size: 38px;
            font-family: Georgia, serif;
            color: #e65f8c;
            animation: latido 1.2s infinite;
        }

        .decoracion {
            font-size: 24px;
            margin: 5px;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes latido {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        @media (max-width: 500px) {

            .contenedor {
                padding: 10px;
            }

            .revelacion {
                min-height: 92vh;
            }

            h1 {
                font-size: 36px;
            }

            h2 {
                font-size: 24px;
            }

            .opcion {
                font-size: 17px;
                padding: 22px 5px;
            }

            .gran-sorpresa {
                font-size: 31px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <!-- ==================== -->
    <!-- PANTALLA 1 -->
    <!-- ==================== -->

    <div class="pantalla" id="pantallaNombre">

        <div class="tarjeta">

            <div class="corazon">💗</div>

            <h1>Baby Shower</h1>

            <p>
                Tenemos una pregunta muy especial...
            </p>

            <h3>             
                Pero antes, dinos tu nombre:
            </h3>


            <input
                type="text"
                id="nombre"
                placeholder="Escribe tu nombre"
                maxlength="50"
            >

            <button class="boton" onclick="continuar()">
                CONTINUAR ✨
            </button>

        </div>

    </div>


    <!-- ==================== -->
    <!-- PANTALLA 2 -->
    <!-- ==================== -->

    <div class="pantalla oculto" id="pantallaPrediccion">

        <div class="prediccion">

            <div class="bebe">
                👶
            </div>

            <h2 id="saludo"></h2>

            <p>
                Ahora si...
            </p>

            <h2>
                ¿Qué crees que es?
            </h2>

            <div class="opciones">

                <button
                    class="opcion nino"
                    onclick="votar('Niño')"
                >
                    💙<br>
                    NIÑO
                </button>

                <button
                    class="opcion nina"
                    onclick="votar('Niña')"
                >
                    💗<br>
                    NIÑA
                </button>

            </div>

        </div>

    </div>


    <!-- ==================== -->
    <!-- PANTALLA 3 -->
    <!-- ==================== -->

    <div class="pantalla oculto" id="pantallaResultado">

        <div class="revelacion">

            <div class="capa">


                <p class="gracias" id="gracias"></p>

                <p class="tu-prediccion">
                    Tu predicción fue:
                </p>

                
                <div class="gran-sorpresa">
                    ¡ES NIÑA! 🎀
                </div>

                
            </div>

        </div>

    </div>

</div>


<script>

    let nombreInvitado = "";

    function continuar() {

        const campo = document.getElementById("nombre");

        nombreInvitado = campo.value.trim();

        if (nombreInvitado === "") {

            alert("Por favor escribe tu nombre 😊");

            return;
        }

        document.getElementById("saludo").innerText =
            "¡Hola, " + nombreInvitado + "! 💗";

        document
            .getElementById("pantallaNombre")
            .classList.add("oculto");

        document
            .getElementById("pantallaPrediccion")
            .classList.remove("oculto");
    }


    function votar(prediccion) {

        document.getElementById("gracias").innerText =
            "¡Gracias, " + nombreInvitado + "! 🎉";

        document.getElementById("resultado").innerText =
            prediccion === "Niña"
                ? "💗 NIÑA"
                : "💙 NIÑO";

        document
            .getElementById("pantallaPrediccion")
            .classList.add("oculto");

        document
            .getElementById("pantallaResultado")
            .classList.remove("oculto");

    }

</script>

</body>
</html>
