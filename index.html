<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Baby Shower Aurora 🎀</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family: Arial, sans-serif;
        }


        /* =====================================
           PANTALLAS
        ===================================== */

        .pantalla {

            width: 100%;
            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        .oculto {
            display: none !important;
        }



        /* =====================================
           PANTALLA 1
           AMARILLA
        ===================================== */

        #pantalla1 {

            background-color: #FFF4B8;
        }


        .tarjeta {

            width: 100%;
            max-width: 450px;

            background-color: #FFFDF4;

            border-radius: 30px;

            padding: 40px 25px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(150, 120, 40, 0.20);
        }


        .icono {

            font-size: 60px;

            margin-bottom: 10px;
        }


        .titulo {

            font-family: Georgia, serif;

            font-size: 42px;

            color: #D5A927;

            margin: 10px 0;
        }


        .texto {

            font-size: 19px;

            color: #756A45;

            line-height: 1.5;
        }


        .pregunta {

            font-family: Georgia, serif;

            font-size: 28px;

            color: #75643B;

            margin-top: 25px;
        }


        input {

            width: 100%;

            padding: 17px;

            margin-top: 15px;

            border-radius: 15px;

            border: 2px solid #E3CE70;

            font-size: 18px;

            text-align: center;

            outline: none;

            background: white;
        }


        .boton-continuar {

            width: 100%;

            margin-top: 20px;

            padding: 17px;

            border: none;

            border-radius: 18px;

            background-color: #E2C247;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }



        /* =====================================
           PANTALLA 2
           AMARILLA
        ===================================== */

        #pantalla2 {

            background-color: #FFF4B8;
        }


        .tarjeta-prediccion {

            width: 100%;
            max-width: 450px;

            background-color: #FFFDF4;

            border-radius: 30px;

            padding: 40px 25px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(150, 120, 40, 0.20);
        }


        .bebe {

            font-size: 70px;

            margin-bottom: 10px;
        }


        .saludo {

            font-family: Georgia, serif;

            font-size: 27px;

            color: #75643B;
        }


        .pregunta2 {

            font-family: Georgia, serif;

            font-size: 28px;

            color: #75643B;

            margin-top: 25px;
        }


        .opciones {

            display: flex;

            gap: 15px;

            margin-top: 30px;
        }


        .opcion {

            flex: 1;

            padding: 25px 10px;

            border: none;

            border-radius: 20px;

            font-size: 19px;

            font-weight: bold;

            cursor: pointer;

            transition: transform 0.2s;
        }


        .opcion:hover {

            transform: scale(1.05);
        }


        .opcion:active {

            transform: scale(0.96);
        }


        .nino {

            background-color: #BFE5FF;

            color: #39759B;
        }


        .nina {

            background-color: #FFD1E0;

            color: #A74F70;
        }



        /* =====================================
           PANTALLA UPS
           ROJO / ROSA PASTEL
        ===================================== */

        #pantallaUps {

            background-color: #F7B6B6;

            text-align: center;
        }


        .mensaje-ups {

            width: 100%;

            max-width: 430px;

            background-color: #FFF4F4;

            border-radius: 30px;

            padding: 40px 25px;

            box-shadow:
                0 10px 35px rgba(170, 80, 80, 0.25);

            animation: aparecer 0.6s ease;
        }


        .icono-ups {

            font-size: 65px;

            margin-bottom: 10px;
        }


        .titulo-ups {

            font-family: Georgia, serif;

            font-size: 42px;

            color: #D66F6F;

            margin: 10px 0 20px;
        }


        .texto-ups {

            font-size: 20px;

            line-height: 1.6;

            color: #8B5A5A;

            margin: 10px 0;
        }


        .espera {

            margin-top: 25px;

            font-size: 15px;

            color: #B07A7A;
        }



        /* =====================================
           PANTALLA 3
           INVITACIÓN
        ===================================== */

        #pantalla3 {

            background-color: #F9DDE7;

            padding: 10px;

            align-items: flex-start;
        }


        .resultado-final {

            width: 100%;

            max-width: 500px;

            text-align: center;

            padding-top: 10px;
        }


        .imagen-invitacion {

            display: block;

            width: 100%;

            height: auto;

            max-width: 100%;

            object-fit: contain;

            border-radius: 20px;

            box-shadow:
                0 8px 25px rgba(150, 80, 110, 0.20);
        }


        .mensaje-final {

            width: 100%;

            padding: 18px 5px 10px;

            text-align: center;
        }


        .gracias {

            margin: 0;

            color: #80566B;

            font-size: 17px;

            font-weight: bold;

            white-space: nowrap;
        }


        .sorpresa {

            margin-top: 12px;

            font-family: Georgia, serif;

            font-size: 38px;

            font-weight: bold;

            color: #E65D8B;

            animation: latido 1.2s infinite;
        }



        /* =====================================
           ANIMACIONES
        ===================================== */

        @keyframes aparecer {

            from {

                opacity: 0;

                transform: translateY(25px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }


        @keyframes latido {

            0%,
            100% {

                transform: scale(1);
            }

            50% {

                transform: scale(1.08);
            }
        }



        /* =====================================
           CELULAR
        ===================================== */

        @media (max-width: 500px) {

            .pantalla {

                padding: 10px;
            }


            .tarjeta {

                padding: 35px 20px;
            }


            .titulo {

                font-size: 36px;
            }


            .pregunta {

                font-size: 25px;
            }


            .bebe {

                font-size: 60px;
            }


            .pregunta2 {

                font-size: 25px;
            }


            .opcion {

                font-size: 17px;

                padding: 23px 5px;
            }


            .mensaje-ups {

                padding: 35px 20px;
            }


            .titulo-ups {

                font-size: 36px;
            }


            .texto-ups {

                font-size: 18px;
            }


            #pantalla3 {

                padding: 10px 5px;
            }


            .gracias {

                /*
                Mantiene el mensaje en una sola línea
                */

                font-size: 13px;

                white-space: nowrap;
            }


            .sorpresa {

                font-size: 31px;
            }

        }

    </style>

</head>


<body>



<!-- =========================================
     PANTALLA 1
========================================= -->

<div
    id="pantalla1"
    class="pantalla"
>


    <div class="tarjeta">


        <div class="icono">
            💛
        </div>


        <h1 class="titulo">
            Baby Shower
        </h1>


        <p class="texto">
            Tenemos una pregunta muy especial...
        </p>


        <h2 class="pregunta">
            ¿Qué crees que es? 👶
        </h2>


        <p class="texto">
            Primero dinos tu nombre:
        </p>


        <input
            type="text"
            id="nombre"
            placeholder="Escribe tu nombre"
            maxlength="50"
            autocomplete="off"
        >


        <button
            type="button"
            class="boton-continuar"
            onclick="continuar()"
        >

            CONTINUAR ✨

        </button>


    </div>


</div>



<!-- =========================================
     PANTALLA 2
========================================= -->

<div
    id="pantalla2"
    class="pantalla oculto"
>


    <div class="tarjeta-prediccion">


        <div class="bebe">
            👶
        </div>


        <h2
            id="saludo"
            class="saludo"
        >
        </h2>


        <p class="texto">
            Ahora sí...
        </p>


        <h2 class="pregunta2">
            ¿Qué crees que es?
        </h2>


        <div class="opciones">


            <!-- BOTÓN NIÑO -->

            <button
                type="button"
                class="opcion nino"
                onclick="votar('Niño')"
            >

                💙

                <br><br>

                NIÑO

            </button>


            <!-- BOTÓN NIÑA -->

            <button
                type="button"
                class="opcion nina"
                onclick="votar('Niña')"
            >

                💗

                <br><br>

                NIÑA

            </button>


        </div>


    </div>


</div>



<!-- =========================================
     PANTALLA UPS
========================================= -->

<div
    id="pantallaUps"
    class="pantalla oculto"
>


    <div class="mensaje-ups">


        <div class="icono-ups">
            😮
        </div>


        <h1 class="titulo-ups">
            ¡UPS!
        </h1>


        <p class="texto-ups">
            Parece que fallaste esta vez...
        </p>


        <p class="texto-ups">
            💗 Pero espera...
        </p>


        <p class="texto-ups">
            La sorpresa está por llegar ✨
        </p>


        <p class="espera">
            Prepárate para descubrir la sorpresa...
        </p>


    </div>


</div>



<!-- =========================================
     PANTALLA 3
     INVITACIÓN
========================================= -->

<div
    id="pantalla3"
    class="pantalla oculto"
>


    <div class="resultado-final">


        <!-- IMAGEN -->

        <img
            src="invitacion.jpeg"
            class="imagen-invitacion"
            alt="Invitación Baby Shower"
        >


        <!-- MENSAJE -->

        <div class="mensaje-final">


            <p
                id="gracias"
                class="gracias"
            >
            </p>


            <div class="sorpresa">

                🎀 ¡ES NIÑA! 🎀

            </div>


        </div>


    </div>


</div>



<script>


    /* ======================================
       NOMBRE DEL INVITADO
    ====================================== */

    let nombreInvitado = "";



    /* ======================================
       PANTALLA 1 → PANTALLA 2
    ====================================== */

    function continuar() {


        const campoNombre =
            document.getElementById("nombre");


        nombreInvitado =
            campoNombre.value.trim();


        if (nombreInvitado === "") {

            alert(
                "Por favor escribe tu nombre 😊"
            );

            campoNombre.focus();

            return;
        }


        /*
        Mostrar saludo
        */

        document
            .getElementById("saludo")
            .textContent =
                "¡Hola, " +
                nombreInvitado +
                "! 💛";


        /*
        Ocultar pantalla 1
        */

        document
            .getElementById("pantalla1")
            .classList
            .add("oculto");


        /*
        Mostrar pantalla 2
        */

        document
            .getElementById("pantalla2")
            .classList
            .remove("oculto");

    }



    /* ======================================
       VOTACIÓN
    ====================================== */

    function votar(prediccion) {


        /*
        SI ELIGIÓ NIÑO
        */

        if (prediccion === "Niño") {


            /*
            Ocultar pantalla 2
            */

            document
                .getElementById("pantalla2")
                .classList
                .add("oculto");


            /*
            Mostrar pantalla UPS
            */

            document
                .getElementById("pantallaUps")
                .classList
                .remove("oculto");


            /*
            Después de 6 segundos
            mostrar la invitación
            */

            setTimeout(
                mostrarInvitacion,
                6000
            );


        }


        /*
        SI ELIGIÓ NIÑA
        */

        else {


            mostrarInvitacion();

        }

    }



    /* ======================================
       MOSTRAR INVITACIÓN
    ====================================== */

    function mostrarInvitacion() {


        /*
        Mensaje con el nombre
        */

        document
            .getElementById("gracias")
            .textContent =
                "Tu predicción quedó registrada. Gracias, " +
                nombreInvitado;


        /*
        Ocultar pantalla UPS
        */

        document
            .getElementById("pantallaUps")
            .classList
            .add("oculto");


        /*
        Ocultar pantalla 2
        */

        document
            .getElementById("pantalla2")
            .classList
            .add("oculto");


        /*
        Mostrar invitación
        */

        document
            .getElementById("pantalla3")
            .classList
            .remove("oculto");

    }


</script>


</body>

</html>
