<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Shower</title>

    <style>
        * {box-sizing: border-box;}
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
        }


        /*  TODAS LAS PANTALLAS */      
        .pantalla {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .oculto { display: none !important; }

        /*  PANTALLA 1  */
        #pantalla1 { background-color: #FFF4B8; }        
        .tarjeta {
            width: 100%;
            max-width: 450px;
            background-color: #FFFDF4;
            border-radius: 30px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(150, 120, 40, 0.20);
        }
        .icono {
            font-size: 60px;
            margin-bottom: 10px;
        }
        .titulo {
            font-family: Georgia, serif;
            font-size: 42px;
            color: #D5A927;
            margin: 10px 0;
        }
        .texto {
            font-size: 19px;
            color: #756A45;
            line-height: 1.5;
        }
        .pregunta {
            font-family: Georgia, serif;
            font-size: 28px;
            color: #75643B;
            margin-top: 25px;
        }
        input {
            width: 100%;
            padding: 17px;
            margin-top: 15px;
            border-radius: 15px;
            border: 2px solid #E3CE70;
            font-size: 18px;
            text-align: center;
            outline: none;
        }
        input:focus { border-color: #C8A62D;}
        .boton-continuar {
            width: 100%;
            margin-top: 20px;
            padding: 17px;
            border: none;
            border-radius: 18px;
            background-color: #E2C247;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /*  PANTALLA 2 */
        #pantalla2 { background-color: #FFF4B8; }
        .tarjeta-prediccion {
            width: 100%;
            max-width: 450px;
            background-color: #FFFDF4;
            border-radius: 30px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(150, 120, 40, 0.20);
        }
        .saludo {
            font-family: Georgia, serif;
            font-size: 27px;
            color: #75643B;
        }
        .pregunta2 {
            font-family: Georgia, serif;
            font-size: 28px;
            color: #75643B;
            margin-top: 25px;
        }
        .opciones {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .opcion {
            flex: 1;
            padding: 25px 10px;
            border: none;
            border-radius: 20px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .opcion:hover {transform: scale(1.05); }
        .nino {
            background-color: #BFE5FF;
            color: #39759B;
        }
        .nina {
            background-color: #FFD1E0;
            color: #A74F70;
        }
        
        /*  PANTALLA 3 */
        #pantalla3 {
            background-color: #F9DDE7;
            padding: 10px;
        }
        /*
        .invitacion {
            position: relative;
            width: 100%;
            max-width: 500px;
            min-height: 95vh;
            border-radius: 20px;
            overflow: hidden;
            background-image: url("invitacion.jpeg");
            background-size: contain; /*Mostrar toda la imagen*
            background-position: center;
            background-repeat: no-repeat;

            display: flex;

            border-radius: 20px;

            padding: 18px;

            text-align: center;

            box-shadow:
                0 5px 20px rgba(100,50,70,0.20);
        }

*/
        .invitacion {
    position: relative;

    width: 100%;
    max-width: 500px;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: flex-end;

    overflow: hidden;

    background: #f9dde7;

    padding: 15px;
}


.imagen-invitacion {
    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: contain;

    object-position: center;

    z-index: 1;
}


.mensaje {
    position: relative;

    z-index: 2;

    width: 100%;

    background: rgba(255,255,255,0.94);

    border-radius: 20px;

    padding: 18px;

    text-align: center;
}




        
        .gracias {

            margin: 0;

            font-size: 20px;

            color: #80566B;
        }


        .prediccion {

            margin: 8px 0;

            font-size: 17px;

            color: #987D8B;
        }


        .sorpresa {

            margin: 5px 0;

            font-family: Georgia, serif;

            font-size: 38px;

            font-weight: bold;

            color: #E65D8B;

            animation: latido 1.2s infinite;
        }


        .decoracion {

            font-size: 25px;

            margin: 5px;
        }


        /* =====================================
           ANIMACIONES
        ===================================== */

        @keyframes latido {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }


        /* =====================================
           CELULAR
        ===================================== */

        @media (max-width: 500px) {

            .titulo {
                font-size: 36px;
            }

            .pregunta {
                font-size: 25px;
            }

            .pregunta2 {
                font-size: 25px;
            }

            .invitacion {
                min-height: 96vh;
            }

            .sorpresa {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     PANTALLA 1
========================================= -->

<div
    id="pantalla1"
    class="pantalla"
>

    <div class="tarjeta">

        <div class="icono">
            💛
        </div>

        <h1 class="titulo">
            Baby Shower
        </h1>

        <p class="texto">
            Tenemos una pregunta muy especial...
        </p>

        <h3 class="pregunta">
            Primero dinos tu nombre:
        </h3>

        <input
            type="text"
            id="nombre"
            placeholder="Escribe tu nombre"
            maxlength="50"
        >

        <button
            type="button"
            class="boton-continuar"
            onclick="continuar()"
        >
            CONTINUAR ✨
        </button>

    </div>

</div>



<!-- =========================================
     PANTALLA 2
========================================= -->

<div
    id="pantalla2"
    class="pantalla oculto"
>

    <div class="tarjeta-prediccion">

        <h2
            id="saludo"
            class="saludo"
        >
        </h2>

        <p class="texto">
            Ahora sí...
        </p>

        <h2 class="pregunta2">
            ¿Qué crees que es?
        </h2>


        <div class="opciones">


            <button
                type="button"
                class="opcion nino"
                onclick="votar('Niño')"
            >

                💙

                <br><br>

                NIÑO

            </button>


            <button
                type="button"
                class="opcion nina"
                onclick="votar('Niña')"
            >

                💗

                <br><br>

                NIÑA

            </button>


        </div>

    </div>

</div>



<!-- =========================================
     PANTALLA 3
========================================= -->

<div id="pantalla3" class="pantalla oculto">

<!--
    <div class="invitacion">
        <div class="mensaje">
            <p id="gracias" class="gracias"></p>
            <div class="sorpresa">  ¡ES NIÑA! 🎀 </div>
        </div>
    </div>
-->
    <div class="invitacion">
    <img src="invitacion.jpeg" class="imagen-invitacion">
        <p id="gracias" class="gracias"></p>
        <p class="prediccion"> Tu predicción quedó registrada 💗 </p>
        <div class="sorpresa"> ¡ES NIÑA! 🎀 </div>       
    </div>




    
</div>

<script>
   /* VARIABLE*/
    let nombreInvitado = "";

    /* BOTÓN CONTINUAR */
    function continuar() {
        const campo = document.getElementById("nombre");
        nombreInvitado = campo.value.trim();
        if (nombreInvitado === "") {
            alert("Por favor escribe tu nombre 😊");
            campo.focus();
            return;
        }

        /* Saludo*/
        document.getElementById("saludo").textContent = "¡Hola, " + nombreInvitado + "! 💛";

        /* Ocultar pantalla 1 */
        document.getElementById("pantalla1").classList.add("oculto");

        /* Mostrar pantalla 2 */
        document.getElementById("pantalla2").classList.remove("oculto");
    }

    /* BOTONES NIÑO / NIÑA */
    function votar(prediccion) {
        
        /* Mostrar nombre */
        document.getElementById("gracias").textContent = "¡Gracias, " + nombreInvitado + "! 🎉";

        /* Ocultar pantalla 2 */
        document.getElementById("pantalla2").classList.add("oculto");

        /* Mostrar pantalla 3 */
        document.getElementById("pantalla3").classList.remove("oculto");
    }

</script>

</body>

</html>
